name: Build Release Variant

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type BUILD to confirm this prototype release-variant build"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: companion-release-build
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.confirm == 'BUILD' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build release variant
        run: gradle :app:assembleRelease --parallel --build-cache --no-daemon

      - name: Prepare APK
        run: |
          set -euo pipefail
          mkdir -p out
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" out/Nuvio-Companion-Prototype-Release.apk

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-prototype-${{ github.run_number }}
          name: Prototype Release Build #${{ github.run_number }}
          body: Prototype build for testing. This APK is currently signed with the debug key and is not a production release.
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: out/*.apk
