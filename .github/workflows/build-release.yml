name: Build Release Variant

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type BUILD to confirm this prototype release-variant build"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: companion-release-build
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.confirm == 'BUILD' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13.2"

      - name: Build release variant
        run: gradle :app:assembleRelease --parallel --build-cache --no-daemon

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p out
          find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -exec cp {} out/Nuvio-Companion-Prototype-Release.apk \;
          test -f out/Nuvio-Companion-Prototype-Release.apk

      - name: Upload release-variant APK
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-companion-release-prototype-${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
