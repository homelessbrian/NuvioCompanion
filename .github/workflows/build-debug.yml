name: Build Debug APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: companion-debug-build
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restore persistent signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.COMPANION_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Add the persistent signing secrets before building updateable APKs. See README.md."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/companion-signing"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/companion-signing/companion.jks"
          test -s "$RUNNER_TEMP/companion-signing/companion.jks"

      - name: Build signed debug APK
        env:
          COMPANION_SIGNING_STORE: ${{ runner.temp }}/companion-signing/companion.jks
          COMPANION_SIGNING_PASSWORD: ${{ secrets.COMPANION_SIGNING_STORE_PASSWORD }}
          COMPANION_SIGNING_ALIAS: ${{ secrets.COMPANION_SIGNING_KEY_ALIAS }}
          COMPANION_SIGNING_KEY_PASSWORD: ${{ secrets.COMPANION_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$COMPANION_SIGNING_PASSWORD"
          test -n "$COMPANION_SIGNING_ALIAS"
          test -n "$COMPANION_SIGNING_KEY_PASSWORD"
          gradle :app:assembleDebug --parallel --build-cache --no-daemon

      - name: Prepare stable APK and checksum
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          mkdir -p downloads
          install -m 0644 "$apk" downloads/NuvioCompanion.apk
          sha256sum downloads/NuvioCompanion.apk > downloads/NuvioCompanion.apk.sha256

      - name: Publish to permanent download location
        run: |
          set -euo pipefail
          git config user.name "homelessbrian"
          git config user.email "38150792+homelessbrian@users.noreply.github.com"
          git add downloads/NuvioCompanion.apk downloads/NuvioCompanion.apk.sha256
          git commit -m "Publish latest NuvioCompanion debug APK"
          git push origin HEAD:main

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioCompanion-debug-${{ github.run_number }}
          path: downloads/NuvioCompanion.apk
          if-no-files-found: error
          retention-days: 30
