name: Build Debug APK

on:
  workflow_dispatch:
    inputs:
      artifact_suffix:
        description: "Optional label for this build (e.g. remote-key-test)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: companion-debug-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13.2"

      - name: Build debug APK
        run: gradle :app:assembleDebug --parallel --build-cache --no-daemon

      - name: Rename APK
        env:
          SUFFIX: ${{ inputs.artifact_suffix }}
        run: |
          set -euo pipefail
          mkdir -p out
          apk="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          suffix="${SUFFIX:-${GITHUB_RUN_NUMBER}}"
          cp "$apk" "out/Nuvio-Companion-Debug-${suffix}.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-companion-debug-${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
