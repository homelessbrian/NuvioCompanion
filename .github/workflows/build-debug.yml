name: Build Debug APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: companion-debug-build
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle :app:assembleDebug --parallel --build-cache --no-daemon

      - name: Prepare stable APK and checksum
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          mkdir -p downloads
          install -m 0644 "$apk" downloads/NuvioLaunch.apk
          sha256sum downloads/NuvioLaunch.apk > downloads/NuvioLaunch.apk.sha256

      - name: Publish to permanent download location
        run: |
          set -euo pipefail
          git config user.name "homelessbrian"
          git config user.email "38150792+homelessbrian@users.noreply.github.com"
          git add downloads/NuvioLaunch.apk downloads/NuvioLaunch.apk.sha256
          git commit -m "Publish latest NuvioLaunch debug APK"
          git push origin HEAD:main

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioLaunch-debug-${{ github.run_number }}
          path: downloads/NuvioLaunch.apk
          if-no-files-found: error
          retention-days: 30
