name: Apply Companion Kit

on:
  push:
    paths:
      - "nuviocompanion-kit.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-companion-kit
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract kit into repository
        run: |
          set -euo pipefail
          test -f nuviocompanion-kit.zip || {
            echo "::error::nuviocompanion-kit.zip was not found in the repository root."
            exit 1
          }
          unzip -o -q nuviocompanion-kit.zip -x ".github/*"
          rm nuviocompanion-kit.zip
          git status --short

      - name: Commit kit changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No project changes found in kit."
          else
            git commit -m "Apply Nuvio Companion kit"
            git push
          fi
