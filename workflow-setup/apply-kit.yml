name: Apply Companion Kit

on:
  push:
    paths:
      - "nuviocompanion-kit.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract kit
        run: |
          set -euo pipefail
          test -f nuviocompanion-kit.zip
          unzip -o -q nuviocompanion-kit.zip -x ".github/*"
          rm nuviocompanion-kit.zip
      - name: Commit update
        env:
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          git config user.name "$GH_ACTOR"
          git config user.email "38150792+homelessbrian@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Apply Companion project update"
            git push
          fi
