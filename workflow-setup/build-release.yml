name: Build Release Variant

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type BUILD to confirm"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: ${{ inputs.confirm == 'BUILD' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build release variant
        run: gradle :app:assembleRelease --parallel --build-cache --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-companion-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
