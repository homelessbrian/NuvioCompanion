name: Build Debug APK

on:
  workflow_dispatch:
    inputs:
      artifact_suffix:
        description: "Optional label for this build"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        run: gradle :app:assembleDebug --parallel --build-cache --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-companion-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
