kit:
  name: Nuvio Companion Starter Kit
  version: 0.1.1
  created: 2026-11-11
  destination: repository-root
  extraction:
    archive: nuviocompanion-kit.zip
    mode: overwrite
    preserve:
      - .github/**
      - workflow-setup/**
  project:
    name: NuvioCompanion
    application_id: com.homelessbrian.nuviocompanion
    namespace: com.homelessbrian.nuviocompanion
    min_sdk: 24
    compile_sdk: 36
    java: 17
    gradle: 8.13
  workflows:
    active_directory: .github/workflows/
    reference_directory: workflow-setup/
    files:
      - apply-kit.yml
      - build-ci.yml
      - build-debug.yml
      - build-release.yml
